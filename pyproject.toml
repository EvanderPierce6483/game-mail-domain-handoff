[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-mail-domain-handoff"
version = "0.1.0"
description = "Game mail sender-domain verification with DNS and email capabilities."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
